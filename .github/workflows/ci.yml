name: CI
run-name: CI — ${{ github.ref_name }}

# Nothing is path-filtered on purpose. `tests/game-release.test.mjs` asserts that the version in
# package.json, both READMEs, index.html and the service worker's CACHE_NAME agree, so a
# markdown-only edit can break the suite exactly like a source edit can.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The repo pins @types/node to the Node major in use (see AGENTS.md), so CI runs that major
  # rather than "latest". package.json's engines floor is 22.13.0.
  NODE_VERSION: '24'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor players' toolchains may still be on; 24 is the major @types/node
        # is pinned to. Both have to run the suite, and a failure on one must not hide the other.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Compiles public/game/src -> public/game/dist first, then runs both suites: the shell/release
      # tests in tests/ and the engine, balance, drama and render tests in public/game/tests/.
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Deliberately excludes public/game/** — that code is framework-free and formatted to its own
      # dense conventions. Its correctness is covered by the test job above.
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  dist-in-sync:
    name: Committed game build is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # public/game/dist/ is what the browser loads and it is committed to git. A source edit that
      # ships without its recompiled output changes nothing for players, and no other check catches
      # it: the test suite compiles first and would pass on the stale commit.
      - name: Recompile the game bundle
        run: npx tsc -p public/game/tsconfig.json
      - name: Fail if the committed output differs
        run: |
          # `git status --porcelain`, not `git diff`: a brand-new module compiles to an *untracked*
          # file, which git diff reports as clean -- and a new module whose output was never
          # committed is the exact mistake this job exists to catch.
          CHANGED=$(git status --porcelain -- public/game/dist)
          if [ -n "${CHANGED}" ]; then
            echo "::error title=Stale public/game/dist::Recompiling public/game/src produced output that differs from the committed bundle. Run 'npm test' (or 'npx tsc -p public/game/tsconfig.json') and commit public/game/dist."
            echo "${CHANGED}"
            git diff --stat -- public/game/dist
            exit 1
          fi
          echo "public/game/dist matches public/game/src."

  build:
    name: Next build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The shell only serves public/game/**; it never compiles it. This job proves the Next build
      # graph still stands on its own, which is the constraint that keeps the game self-contained.
      - run: npm run build
