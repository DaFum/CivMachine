<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Reality Consumption Engine — Browser Edition</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./mobile.css">
  <!-- The module graph is four levels deep and unbundled, so without these the browser discovers the
       heaviest leaves only after parsing their importers. Cheap on repeat visits (the service worker
       has them), decisive on the first one. -->
  <link rel="modulepreload" href="./dist/data/content.generated.js">
  <link rel="modulepreload" href="./dist/game/engine.js">
  <link rel="modulepreload" href="./dist/render/world.js">
  <link rel="modulepreload" href="./dist/ui/app.js">
  <link rel="modulepreload" href="./dist/ui/view-model.js">
  <link rel="modulepreload" href="./dist/data/intervention-copy.js">
  <link rel="modulepreload" href="./dist/data/apotheosis-events.js">
  <link rel="modulepreload" href="./dist/game/guidance.js">
  <link rel="modulepreload" href="./dist/ui/format.js">
  <link rel="modulepreload" href="./dist/data/localization.js">
  <link rel="modulepreload" href="./dist/data/i18n.js">
</head>
<body>
  <div class="background-noise"></div>
  <div id="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">RCE</span><div><b>REALITY CONSUMPTION ENGINE</b><small>BROWSER CULTIVATION NODE</small></div></div>
      <div id="resource-bar" class="resource-bar"></div>
      <!-- The static copy in this file is the English default and the pre-hydration paint. `main.ts`
           rewrites every one of these strings from the localization catalog on boot and on every
           locale change, so a stale label here survives exactly one frame. -->
      <select id="locale-select" class="icon-button" title="Language" aria-label="Language"></select>
      <button id="explain-toggle" class="icon-button" data-action="explain" aria-pressed="false" title="Explain mode: annotate every panel with what it is for and what it decides." aria-label="Toggle explain mode: annotate every panel with what it is, where it is and why it matters">?</button>
      <button id="reset-save" class="icon-button" title="Reset browser save" aria-label="Reset browser save">⌫</button>
    </header>
    <div id="meta-bar" class="meta-bar"></div>
    <main>
      <section id="machine-view" class="phase-view"></section>
      <section id="civilization-view" class="phase-view is-hidden">
        <div id="world-shell" class="world-shell">
          <div id="world-surface" class="world-surface" role="img" aria-label="Scrollable civilization visualization"></div>
          <div id="world-hud" class="world-hud"></div>
        </div>
        <div id="civilization-panels" class="civilization-panels"></div>
      </section>
      <section id="victory-view" class="phase-view is-hidden"></section>
      <!-- `role="log"` names the region so it can be navigated to and read on demand. The live setting
         is deliberately off, not merely absent: the situation banner is already a polite status
         region narrating the same events in summary, and a record that appends on every intervention
         and every tactical action would talk over it continuously. One narrator, not two. -->
    <section class="machine-log panel"><div class="panel-kicker">MACHINE RECORD</div><ul id="machine-log" role="log" aria-live="off"></ul></section>
    </main>
    <!-- The guided run's coach card. It lives outside the phase views so a step can point at either
         of them, and it is never a modal: ignoring it entirely still plays a normal game. -->
    <div id="tutorial-layer" class="tutorial-layer is-hidden"></div>
    <!-- `data-version` is where `main.ts` reads the shipped version from when it fills the localized
         footer template; the text beside it is the same string in English, for the first paint. -->
    <footer><span id="footer-version" data-version="1.16.0">Reality Consumption Engine Browser v1.16.0</span><span id="footer-tech">v4 save · migrating loader · localStorage · No offline progression</span></footer>
  </div>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
